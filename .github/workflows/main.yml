name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up CocoaPods
        run: |
          pod install || pod install --repo-update

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -workspace *.xcworkspace \
            -scheme "Studytime" \
            -sdk iphoneos \
            -archivePath build/Studytime.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Studytime.xcarchive/Products/Applications/*.app Payload/
          zip -r Studytime.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyTime-IPA
          path: Studytime.ipa

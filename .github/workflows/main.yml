name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Pods
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build Xcode Archive
        run: |
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
            SCHEME=$(basename "$WORKSPACE" .xcodeproj)
          fi

          echo "Using Workspace/Project: $WORKSPACE"
          echo "Using Scheme: $SCHEME"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r StudyTime.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyTime-IPA
          path: StudyTime.ipa

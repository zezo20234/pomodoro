<style>

main{max-width:760px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
input,select{font-size:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

input,select{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;width:100%}

<style>
:root{--bg:#eef3f5;--card:#fff;--ink:#14202b;--mute:#6a7885;--line:#e1e8ed;--focus:#0d9488;--brk:#e08a1e;--on:#fff;--sh:0 1px 2px rgba(20,32,43,.05),0 10px 28px rgba(20,32,43,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1317;--card:#151d23;--ink:#e8eef2;--mute:#8d9aa5;--line:#25303a;--focus:#2dd4bf;--brk:#fbbf24;--on:#032421;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25)}}

main{padding-bottom:110px}
h1{font-size:19px;letter-spacing:-.01em}

.btn.alt{border-color:var(--line);background:var(--card)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;justify-content:center;gap:6px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 85%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}

</style></head><body><main>
<section id="auth" class="card" style="max-width:360px;margin:60px auto">
<h1>Study Together</h1><p class="mute">Sign in with a username and password. New here? Pick any username and tap Create account.</p>
<form id="af"><div class="row" style="flex-direction:column;align-items:stretch">
<input id="u" placeholder="Username" autocomplete="username" required>
<input id="p" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" required>
<div class="err" id="ae"></div>
<div class="row"><button class="btn" id="li" type="submit">Sign in</button><button class="btn alt" id="su" type="button">Create account</button></div></div></form></section>

<div id="app" class="hide">
<header><div class="row"><button class="btn alt" id="rf" aria-label="Refresh" title="Refresh" style="padding:7px 12px;font-size:18px;line-height:1">&#8635;</button><h1>Study Together</h1></div><div class="row"><span class="mute" id="who"></span><button class="btn alt" id="out">Sign out</button></div></header>
<nav><button data-t="t" class="on">Timer</button><button data-t="r">Room</button><button data-t="s">Stats</button></nav>

<section id="t">
<div class="card">
<div class="ring" id="ring"><svg viewBox="0 0 220 220"><circle class="tr" cx="110" cy="110" r="100"/><circle class="ar" id="arc" cx="110" cy="110" r="100"/></svg>
<div class="mid"><div id="ph" class="mute">Ready</div><div id="clk">25:00</div><div id="sub" class="mute"></div></div></div><div class="dots" id="dots"></div>
<div class="row hide" id="adj" style="justify-content:center;margin-bottom:12px"><span class="mute">This phase:</span><button class="btn alt" data-a="-300">−5</button><button class="btn alt" data-a="-60">−1</button><button class="btn alt" data-a="60">+1</button><button class="btn alt" data-a="300">+5</button><span class="mute">min</span></div>
<div class="row modes" id="modes"><button data-m="15/3">15 / 3</button><button data-m="25/5" class="on">25 / 5</button><button data-m="50/10">50 / 10</button></div>
<div class="row sec"><div style="flex:1;min-width:140px"><label class="mute">Subject</label><input id="subj" list="sl" placeholder="e.g. Math" maxlength="24"><datalist id="sl"></datalist></div>
<div style="width:84px"><label class="mute">Focus min</label><input id="fm" type="number" inputmode="numeric" min="1" max="180" value="25"></div><div style="width:84px"><label class="mute">Break min</label><input id="bm" type="number" inputmode="numeric" min="1" max="60" value="5"></div><div style="width:84px"><label class="mute">Cycles</label><input id="cyc" type="number" inputmode="numeric" min="1" max="20" value="4"></div></div>
<div class="row sec" style="justify-content:center"><button class="btn" id="go">Start</button><button class="btn alt" id="skip">Skip</button><button class="btn alt hide" id="fin">Finish</button><button class="btn alt" id="rst">Reset</button></div>
</div>
<div class="card sec"><h2>Study room</h2>
<div class="row"><input id="rc" placeholder="Room code (share it with your sibling)" style="flex:1;min-width:180px"><button class="btn" id="jr">Join</button><button class="btn alt hide" id="lr">Leave</button></div>
<div class="mute" id="rs" style="margin-top:6px">Not in a room.</div></div>
</section>

<section id="r" class="hide">
<div class="mute" id="rn">Join a room from the Timer tab to see everyone here.</div>
<div class="grid" id="mem"></div>
<div class="card sec lb"><h2>Today’s leaderboard</h2><div id="lb" class="mute">No one yet.</div></div>
<div class="card sec"><h2>Chat</h2><div id="chat"></div>
<form id="cf" class="row"><input id="ct" placeholder="Message" maxlength="300" style="flex:1"><button class="btn">Send</button></form></div>
</section>

<section id="s" class="hide"><div id="stats"></div></section>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,get,runTransaction,update,push,onValue,onChildAdded,remove,onDisconnect,increment,query,limitToLast} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {getAnalytics} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

const app=initializeApp({apiKey:"AIzaSyAfm1SkQSqwpf-82kWrsTgoiXgk2DMOSpU",authDomain:"retrocallapp.firebaseapp.com",databaseURL:"https://retrocallapp-default-rtdb.firebaseio.com",projectId:"retrocallapp",storageBucket:"retrocallapp.firebasestorage.app",messagingSenderId:"364436629934",appId:"1:364436629934:web:080df2aa03fad1f6fcc03f",measurementId:"G-NJEQGNFND2"});
try{getAnalytics(app)}catch(e){}
const db=getDatabase(app);

const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${pad(m)}m`:`${m}m`};
const clock=s=>{s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+':'+pad(s%60)};
const dk=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const skey=s=>((s||'General').replace(/[.#$\[\]\/]/g,'-').trim().slice(0,24))||'General';
const MODES={'15/3':[15,3],'25/5':[25,5],'50/10':[50,10]};

let me=null,stats={},room=null,members={},unsubs=[];
const T={fm:25,bm:5,total:1500,cycles:4,subject:'',phase:'idle',cycle:1,running:false,end:0,left:1500,focusBase:0,focusSince:0,lastLog:0};
const dur=()=>(T.phase==='break'?T.bm:T.fm)*60,modeStr=()=>T.fm+'/'+T.bm;

/* ---------- accounts (stored in Realtime Database) ---------- */
/* accounts/{username_lowercase} = {name, salt, hash, created}   passwords are salted + hashed, never stored as plain text */
const SKEY='study-session',validU=u=>/^[A-Za-z0-9_]{2,16}$/.test(u),ukey=u=>u.toLowerCase();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt){
 if(!(window.crypto&&crypto.subtle))throw new Error('Secure context (https) required.');
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:100000},k,256));
}
let statsOff=null;
function enter(user){
 me={uid:user.key,name:user.name};
 try{localStorage.setItem(SKEY,JSON.stringify(user))}catch(e){}
 $('#auth').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=me.name;
 if(statsOff)statsOff();
 statsOff=onValue(ref(db,`users/${me.uid}`),s=>{stats=s.val()||{};drawStats();drawSubjects()});
}
function showAuth(){
 me=null;stats={};if(statsOff){statsOff();statsOff=null}
 try{localStorage.removeItem(SKEY)}catch(e){}
 $('#p').value='';$('#auth').classList.remove('hide');$('#app').classList.add('hide');
}
$('#af').onsubmit=async e=>{e.preventDefault();$('#ae').textContent='';
 const u=$('#u').value.trim();
 if(!validU(u))return $('#ae').textContent='Username: 2–16 letters, numbers or _.';
 try{
  const a=(await get(ref(db,`accounts/${ukey(u)}`))).val();
  if(!a||await hashPw($('#p').value,a.salt)!==a.hash)return $('#ae').textContent='Wrong username or password.';
  enter({key:ukey(u),name:a.name});
 }catch(x){$('#ae').textContent=x.message}};
$('#su').onclick=async()=>{$('#ae').textContent='';
 const u=$('#u').value.trim(),pw=$('#p').value;
 if(!validU(u))return $('#ae').textContent='Username: 2–16 letters, numbers or _.';
 if(pw.length<6)return $('#ae').textContent='Use at least 6 characters.';
 try{
  const salt=hex(crypto.getRandomValues(new Uint8Array(16))),hash=await hashPw(pw,salt);
  const r=await runTransaction(ref(db,`accounts/${ukey(u)}`),cur=>cur===null?{name:u,salt,hash,created:Date.now()}:undefined);
  if(!r.committed)return $('#ae').textContent='That username is taken.';
  enter({key:ukey(u),name:u});
 }catch(x){$('#ae').textContent=x.message}};
$('#out').onclick=async()=>{await leave();showAuth()};
(async()=>{ /* restore saved session */
 let u=null;try{u=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
 if(!u||!u.key)return;
 try{const s=await get(ref(db,`accounts/${u.key}`));s.exists()?enter(u):showAuth()}
 catch(e){enter(u)} /* offline: trust saved session */
})();

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 ['t','r','s'].forEach(id=>$('#'+id).classList.toggle('hide',id!==b.dataset.t))});

/* ---------- timer ---------- */
function flush(t=Date.now()){
 if(T.phase!=='focus'||!T.running||!T.lastLog||!me)return;
 const d=Math.floor((t-T.lastLog)/1000);if(d<1)return;T.lastLog+=d*1000;
 const day=dk();
 update(ref(db),{[`users/${me.uid}/total`]:increment(d),[`users/${me.uid}/days/${day}/total`]:increment(d),[`users/${me.uid}/days/${day}/s/${skey(T.subject)}`]:increment(d)});
}
function publish(){
 if(!room||!me)return;
 set(ref(db,`rooms/${room}/members/${me.uid}`),{name:me.name,mode:modeStr(),phase:T.phase,cycle:T.cycle,cycles:T.cycles,subject:T.subject||'',running:T.running,end:T.running?T.end:0,left:T.running?0:Math.round(T.left),focusBase:T.focusBase,focusSince:T.focusSince,today:(stats.days&&stats.days[dk()]&&stats.days[dk()].total)||0,all:stats.total||0,streak:streak(),t:Date.now()});
}
function beep(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.15;o.frequency.value=660;o.start();o.stop(c.currentTime+.4)}catch(e){}}
function begin(phase){T.phase=phase;T.left=dur();T.total=T.left;T.end=Date.now()+T.left*1000;T.running=true;
 if(phase==='focus'){T.focusSince=T.lastLog=Date.now()}}
function finish(){
 const t=Math.min(Date.now(),T.end);
 if(T.phase==='focus'){flush(t);T.focusBase+=t-T.focusSince;T.focusSince=0;T.lastLog=0;
  if(T.cycle>=T.cycles){T.phase='done';T.running=false;T.left=0}else begin('break')}
 else if(T.cycle>=T.cycles){T.phase='done';T.running=false;T.left=0}
 else{T.cycle++;begin('focus')}
 beep();publish();
}
$('#go').onclick=()=>{
 if(T.running){flush();if(T.phase==='focus'){T.focusBase+=Date.now()-T.focusSince;T.focusSince=0;T.lastLog=0}T.left=(T.end-Date.now())/1000;T.running=false}
 else{
  if(T.phase==='idle'||T.phase==='done'){T.early=false;T.cycle=1;T.focusBase=0;T.cycles=Math.max(1,Math.min(20,+$('#cyc').value||4));T.fm=Math.max(1,Math.min(180,+$('#fm').value||25));T.bm=Math.max(1,Math.min(60,+$('#bm').value||5));T.subject=$('#subj').value.trim();begin('focus')}
  else{T.end=Date.now()+T.left*1000;T.running=true;if(T.phase==='focus')T.focusSince=T.lastLog=Date.now()}
 }
 publish();drawTimer()};
$('#skip').onclick=()=>{if(T.phase==='idle'||T.phase==='done')return;if(!T.running){T.running=true;T.end=Date.now();if(T.phase==='focus')T.focusSince=T.lastLog=Date.now()}else T.end=Date.now();finish();drawTimer()};
$('#rf').onclick=async()=>{
 flush();
 try{
  if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}
  if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
 }catch(e){}
 location.replace(location.pathname+'?r='+Date.now());
};
$('#fin').onclick=()=>{
 if(T.phase!=='focus'&&T.phase!=='break')return;
 flush();
 if(T.phase==='focus'&&T.focusSince){T.focusBase+=Date.now()-T.focusSince}
 T.focusSince=0;T.lastLog=0;T.running=false;T.phase='done';T.early=true;T.left=0;
 publish();drawTimer()};
$('#rst').onclick=()=>{flush();T.running=false;T.phase='idle';T.cycle=1;T.focusBase=0;T.focusSince=0;T.lastLog=0;T.left=T.fm*60;publish();drawTimer()};
const clamp=(v,a,b,d)=>Math.max(a,Math.min(b,Math.round(+v)||d));
const idleNow=()=>T.phase==='idle'||T.phase==='done';
const leftNow=()=>T.running?(T.end-Date.now())/1000:T.left;
const syncInputs=()=>{$('#fm').value=T.fm;$('#bm').value=T.bm;$('#cyc').value=T.cycles};
/* resize the running phase to the new length, keeping the time already elapsed */
function retime(){
 if(idleNow()){T.left=T.fm*60;return}
 const nt=dur(),nl=Math.max(1,nt-(T.total-leftNow()));
 if(T.running)T.end=Date.now()+nl*1000;else T.left=nl;
 T.total=nt;
}
const changed=()=>{retime();publish();drawTimer()};
$('#modes').onclick=e=>{const m=e.target.dataset.m;if(!m)return;[T.fm,T.bm]=m.split('/').map(Number);syncInputs();changed()};
$('#fm').onchange=()=>{T.fm=clamp($('#fm').value,1,180,25);syncInputs();changed()};
$('#bm').onchange=()=>{T.bm=clamp($('#bm').value,1,60,5);syncInputs();changed()};
$('#cyc').onchange=()=>{let n=clamp($('#cyc').value,1,20,4);if(!idleNow())n=Math.max(n,T.cycle);T.cycles=n;syncInputs();publish();drawTimer()};
$('#subj').onchange=()=>{if(idleNow())return;flush();T.subject=$('#subj').value.trim();publish();drawTimer()};
$('#adj').onclick=e=>{const a=+e.target.dataset.a;if(!a||idleNow())return;
 const nl=Math.max(1,leftNow()+a);T.total=Math.max(nl,T.total+a);
 if(T.running)T.end=Date.now()+nl*1000;else T.left=nl;
 publish();drawTimer()};
function drawTimer(){
 const idle=T.phase==='idle'||T.phase==='done';
 const left=T.running?(T.end-Date.now())/1000:(idle?T.fm*60:T.left);
 $('#clk').textContent=clock(left);
 const total=idle?T.fm*60:T.total;
 $('#arc').style.strokeDashoffset=idle?0:628.32*(1-Math.max(0,Math.min(1,left/total)));
 $('#ring').classList.toggle('brk',T.phase==='break');
 $('#sub').textContent=idle?`${T.fm} / ${T.bm} · ${T.cycles} cycles`:`${T.subject||'No subject'} · cycle ${T.cycle} of ${T.cycles}`;
 $('#ph').innerHTML=T.phase==='focus'?'<span class="f">Focus</span>':T.phase==='break'?'<span class="b">Break</span>':T.phase==='done'?(T.early?'Finished early':'All done'):'Ready';
 if(T.phase==='done')$('#sub').textContent=`You studied ${fmt(T.focusBase/1000)}`;
 $('#fin').classList.toggle('hide',idle);$('#adj').classList.toggle('hide',idle);
 $('#go').textContent=T.running?'Pause':idle?'Start':'Resume';
 document.querySelectorAll('#modes button').forEach(b=>{b.classList.toggle('on',b.dataset.m===modeStr())});
 $('#dots').innerHTML=Array.from({length:T.cycles},(_,i)=>`<i class="${i+1<T.cycle||(T.phase==='done'&&!T.early)?'d':''} ${i+1===T.cycle&&!idle?'c':''}"></i>`).join('');
 document.title=T.running?`${clock(left)} · Study Together`:'Study Together';
}
setInterval(()=>{
 if(T.running){if(Date.now()>=T.end)finish();else if(T.phase==='focus'&&Date.now()-T.lastLog>=30000){flush();publish()}}
 drawTimer();drawMembers();
},500);

/* ---------- rooms ---------- */
async function leave(){
 unsubs.forEach(f=>f());unsubs=[];
 if(room&&me){try{await remove(ref(db,`rooms/${room}/members/${me.uid}`))}catch(e){}}
 room=null;members={};$('#chat').innerHTML='';$('#lr').classList.add('hide');$('#jr').textContent='Join';$('#rs').textContent='Not in a room.';$('#rn').textContent='Join a room from the Timer tab to see everyone here.';drawMembers();
}
$('#jr').onclick=async()=>{
 const c=$('#rc').value.toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,30);if(!c)return;
 await leave();room=c;
 const mref=ref(db,`rooms/${c}/members/${me.uid}`);onDisconnect(mref).remove();publish();
 unsubs.push(onValue(ref(db,`rooms/${c}/members`),s=>{members=s.val()||{};drawMembers()}));
 unsubs.push(onChildAdded(query(ref(db,`rooms/${c}/chat`),limitToLast(50)),s=>{const m=s.val(),p=document.createElement('p');p.innerHTML=`<b>${esc(m.name)}</b> ${esc(m.text)}`;const box=$('#chat');box.appendChild(p);box.scrollTop=box.scrollHeight}));
 $('#jr').textContent='Switch';$('#lr').classList.remove('hide');$('#rs').textContent=`In room “${c}”. Share this code to study together.`;$('#rn').textContent=`Room: ${c}`;
};
$('#lr').onclick=leave;
$('#rc').onkeydown=e=>{if(e.key==='Enter')$('#jr').click()};
$('#cf').onsubmit=e=>{e.preventDefault();const t=$('#ct').value.trim();if(!t||!room)return;push(ref(db,`rooms/${room}/chat`),{uid:me.uid,name:me.name,text:t,t:Date.now()});$('#ct').value=''};
function drawMembers(){
 const now=Date.now(),list=Object.entries(members).map(([id,m])=>{
  const idle=m.phase==='idle'||m.phase==='done';
  const rem=m.running?(m.end-now)/1000:(idle?(parseInt(m.mode)||25)*60:m.left);
  const work=(m.focusBase+(m.focusSince?now-m.focusSince:0))/1000;
  return {id,m,rem,work,idle}});
 $('#mem').innerHTML=list.map(({id,m,rem,work,idle})=>`<div class="card mem ${m.phase}"><div class="row" style="flex-wrap:nowrap"><div class="av">${esc(m.name[0]||'?').toUpperCase()}</div><div><b>${esc(m.name)}${id===me.uid?' (you)':''}</b>
 <span class="mute">${esc(m.subject||'No subject')} · ${m.mode}</span></div></div>
 <div class="t ${m.phase==='focus'?'f':m.phase==='break'?'b':''}">${clock(rem)}</div>
 <div>${m.phase==='focus'?'Focusing':m.phase==='break'?'On break':m.phase==='done'?'Finished':'Idle'}${!m.running&&!idle?' (paused)':''}</div>
 <div class="mute">Working ${fmt(work)} · cycle ${m.cycle} of ${m.cycles}</div>
 <div class="mute">Today ${fmt(m.today)} · all time ${fmt(m.all)} · ${m.streak||0}-day streak</div></div>`).join('');
 const lb=list.slice().sort((a,b)=>b.m.today-a.m.today);
 $('#lb').innerHTML=lb.length?lb.map((x,i)=>`<div><span>${i+1}. ${esc(x.m.name)}</span><span>${fmt(x.m.today)}</span></div>`).join(''):'No one yet.';
}

/* ---------- analytics ---------- */
function dayTotal(d){return(stats.days&&stats.days[d]&&stats.days[d].total)||0}
function streak(){let n=0,d=new Date();if(!dayTotal(dk(d)))d.setDate(d.getDate()-1);while(dayTotal(dk(d))>0){n++;d.setDate(d.getDate()-1)}return n}
function drawSubjects(){$('#sl').innerHTML=Object.keys(Object.values(stats.days||{}).reduce((a,d)=>Object.assign(a,d.s||{}),{})).map(s=>`<option value="${esc(s)}">`).join('')}
function drawStats(){
 const days=stats.days||{},all=Object.keys(days);
 const last=n=>Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return {d,k:dk(d),v:dayTotal(dk(d))}});
 const w=last(7),mx=Math.max(1,...w.map(x=>x.v)),m30=last(30).reduce((a,x)=>a+x.v,0);
 const week=w.reduce((a,x)=>a+x.v,0),best=Math.max(0,...all.map(dayTotal));
 const subj={};all.forEach(k=>Object.entries(days[k].s||{}).forEach(([s,v])=>subj[s]=(subj[s]||0)+v));
 const sl=Object.entries(subj).sort((a,b)=>b[1]-a[1]),sm=sl.length?sl[0][1]:1;
 $('#stats').innerHTML=`<div class="kpi">
 <div class="card"><b>${fmt(dayTotal(dk()))}</b><span class="mute">Today</span></div>
 <div class="card"><b>${fmt(stats.total||0)}</b><span class="mute">All time</span></div>
 <div class="card"><b>${streak()} days</b><span class="mute">Current streak</span></div>
 <div class="card"><b>${fmt(week)}</b><span class="mute">Last 7 days</span></div>
 <div class="card"><b>${fmt(m30/30)}</b><span class="mute">Daily average (30 days)</span></div>
 <div class="card"><b>${fmt(best)}</b><span class="mute">Best day</span></div></div>
 <div class="card"><h2>Last 7 days</h2><div class="bars">${w.map(x=>`<div><small>${x.v?fmt(x.v):''}</small><span style="height:${x.v/mx*100}%"></span>${x.d.toLocaleDateString(undefined,{weekday:'short'})}</div>`).join('')}</div></div>
 <div class="card sec"><h2>By subject (all time)</h2>${sl.length?sl.map(([s,v])=>`<div class="sb">${esc(s)} <span class="mute">${fmt(v)}</span><i style="width:${v/sm*100}%"></i></div>`).join(''):'<span class="mute">Finish a focus session to see subjects here.</span>'}</div>`;
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let wl=null;
async function keepAwake(){try{if(T.running&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}else if(!T.running&&wl){wl.release();wl=null}}catch(e){}}
setInterval(keepAwake,2000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(T.running&&Date.now()>=T.end)finish();else if(T.running&&T.phase==='focus'){flush();publish()}keepAwake();drawTimer()}});
drawTimer();
</script></main></body></html>

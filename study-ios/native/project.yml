name: StudyTogether
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Capacitor:
    url: https://github.com/ionic-team/capacitor-swift-pm.git
    from: 7.0.0
  CapacitorHaptics:
    path: ../node_modules/@capacitor/haptics
  CapacitorLocalNotifications:
    path: ../node_modules/@capacitor/local-notifications
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: gen/public
        type: folder
        buildPhase: resources
      - path: gen/capacitor.config.json
        buildPhase: resources
    dependencies:
      - target: StudyWidget
      - package: Capacitor
        product: Capacitor
      - package: Capacitor
        product: Cordova
      - package: CapacitorHaptics
      - package: CapacitorLocalNotifications
    info:
      path: Plists/App.plist
      properties:
        CFBundleDisplayName: Study Together
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: Rings an alarm when your study timer ends.
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.studytogether
        PRODUCT_NAME: App
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  StudyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Plists/Widget.plist
      properties:
        CFBundleDisplayName: Study Timer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.studytogether.StudyWidget
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
